# Shared AI service (ADR-0017 and ADR-0019 in sirloinbh/project-standards). Registry: shared-ai, slot 11.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    ports: ['127.0.0.1:${DB_PORT:-15411}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ai -d ai']
      interval: 60s
      retries: 3
      start_period: 30s
      start_interval: 2s
  api:
    build: { context: ./backend, secrets: [npm_token] }
    image: shared-ai-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    # A tiny init as PID 1 passes SIGTERM on to node, so `docker compose stop api` ends at once instead of after 10 s (#7).
    init: true
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: 3111
      DATABASE_URL: postgres://ai:${POSTGRES_PASSWORD}@db:5432/ai
      AI_TOOLS_SIGNING_KEY: ${AI_TOOLS_SIGNING_KEY:?set AI_TOOLS_SIGNING_KEY}
      AI_OWNER_ID: ${AI_OWNER_ID:-owner}
      AI_TOOLS_REFRESH_SECONDS: ${AI_TOOLS_REFRESH_SECONDS:-180}
      AI_TOOL_APPS: ${AI_TOOL_APPS:-}
      AI_MONTHLY_TOKEN_LIMIT: ${AI_MONTHLY_TOKEN_LIMIT:-5000000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      # The AI shell (/api/chat) asks the shared sign-in who is calling, over the shared-auth network (#612).
      AUTH_INTERNAL_URL: ${AUTH_INTERNAL_URL:-http://shared-auth-api:3110}
      AI_ROOT_DOMAIN: ${AI_ROOT_DOMAIN:-daysofme.com}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3111/api/health']
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s
    # The server proxy forwards https://ai.<root domain> here. Locally: http://localhost:8111.
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8111}:3111']
    networks:
      default: {}
      # The hub reads each app's /internal/tools at http://<app>-api:<api port> on this network. Apps join it
      # with the alias <app>-api; it is never published through the proxy.
      shared-ai: {}
      shared-auth: {}
networks:
  # Created by the shared-auth compose project, which starts first. Locally, once: docker network create shared-auth
  shared-auth:
    external: true
  # Created by deploy/deploy.sh (or an app's deploy) when missing, so either side may start first.
  # Locally, once: docker network create shared-ai
  shared-ai:
    name: shared-ai
    external: true
# The backend Dockerfile reads the GitHub Packages token as a BuildKit secret, so it never lands in an image layer.
secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
volumes:
  db-data:
